<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>잇투게더 채팅 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h2 { color: #333; margin-bottom: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h3 { color: #555; font-size: 14px; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        input, textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
        textarea { resize: none; }
        .row { display: flex; gap: 8px; margin-bottom: 8px; }
        .row input { flex: 1; }
        button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
        .btn-primary { background: #4CAF50; color: white; }
        .btn-danger  { background: #f44336; color: white; }
        .btn-blue    { background: #2196F3; color: white; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status.connected    { background: #e8f5e9; color: #2e7d32; }
        .status.disconnected { background: #fce4ec; color: #c62828; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 12px; background: #fafafa; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .msg.talk  { background: #e3f2fd; border-left: 3px solid #2196F3; }
        .msg.enter { background: #f1f8e9; border-left: 3px solid #8BC34A; color: #558B2F; font-style: italic; }
        .msg.leave { background: #fce4ec; border-left: 3px solid #E91E63; color: #880E4F; font-style: italic; }
        .msg.system { background: #f3e5f5; color: #6A1B9A; font-style: italic; }
        .msg .meta { font-size: 11px; color: #999; margin-top: 4px; }
        .send-row { display: flex; gap: 8px; }
        .send-row input { flex: 1; }
        label { font-size: 13px; color: #666; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🍽 잇투게더 채팅 테스트</h2>

    <!-- 연결 설정 -->
    <div class="card">
        <h3>1. 연결 설정</h3>
        <div class="row">
            <div style="flex:1">
                <label>서버 URL</label>
                <input id="serverUrl" value="http://localhost:8080/ws" />
            </div>
            <div style="flex:1">
                <label>모임 ID (gatheringId)</label>
                <input id="gatheringId" type="number" value="1" />
            </div>
        </div>
        <div style="margin-bottom:12px">
            <label>JWT Access Token</label>
            <textarea id="jwtToken" rows="3" placeholder="Bearer 없이 토큰만 입력 (로그인 후 발급된 accessToken)"></textarea>
        </div>
        <div style="display:flex; align-items:center; gap:12px">
            <button class="btn-primary" id="connectBtn" onclick="connect()">연결</button>
            <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>연결 해제</button>
            <span id="statusBadge" class="status disconnected">● 연결 안 됨</span>
        </div>
    </div>

    <!-- 채팅창 -->
    <div class="card">
        <h3>2. 채팅</h3>
        <div id="messages"></div>
        <br>
        <div class="send-row">
            <input id="messageInput" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendMessage()" disabled />
            <button class="btn-blue" id="sendBtn" onclick="sendMessage()" disabled>전송</button>
        </div>
    </div>

    <!-- 채팅 이력 -->
    <div class="card">
        <h3>3. 채팅 이력 조회 (REST API)</h3>
        <div style="display:flex; gap:8px">
            <button class="btn-blue" onclick="loadHistory()">이력 불러오기</button>
        </div>
    </div>
</div>

<script>
let stompClient = null;

function connect() {
    const url = document.getElementById('serverUrl').value;
    const gatheringId = document.getElementById('gatheringId').value;
    const token = document.getElementById('jwtToken').value.trim();

    if (!token) {
        alert('JWT 토큰을 입력하세요.');
        return;
    }

    const socket = new SockJS(url);
    stompClient = new StompJs.Client({
        webSocketFactory: () => socket,
        connectHeaders: { Authorization: 'Bearer ' + token },
        onConnect: () => {
            setStatus(true);
            appendMessage('system', '서버에 연결되었습니다.');

            // 모임 채널 구독
            stompClient.subscribe(`/topic/gathering/${gatheringId}`, (msg) => {
                const data = JSON.parse(msg.body);
                appendMessage(data.type?.toLowerCase() || 'talk', data);
            });

            // 입장 알림 전송
            stompClient.publish({ destination: `/app/chat/${gatheringId}/enter`, body: '{}' });
        },
        onDisconnect: () => { setStatus(false); appendMessage('system', '연결이 해제되었습니다.'); },
        onStompError: (frame) => {
            appendMessage('system', '오류: ' + frame.headers?.message);
            setStatus(false);
        }
    });

    stompClient.activate();
}

function disconnect() {
    stompClient?.deactivate();
}

function sendMessage() {
    const input = document.getElementById('messageInput');
    const content = input.value.trim();
    const gatheringId = document.getElementById('gatheringId').value;

    if (!content || !stompClient?.connected) return;

    stompClient.publish({
        destination: `/app/chat/${gatheringId}`,
        body: JSON.stringify({ content })
    });
    input.value = '';
}

async function loadHistory() {
    const gatheringId = document.getElementById('gatheringId').value;
    const token = document.getElementById('jwtToken').value.trim();
    const serverBase = document.getElementById('serverUrl').value.replace('/ws', '');

    try {
        const res = await fetch(`${serverBase}/api/chat/${gatheringId}/history?page=0&size=50`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const json = await res.json();
        if (json.success && json.data.length > 0) {
            json.data.forEach(msg => appendMessage('talk', msg));
        } else {
            appendMessage('system', '채팅 이력이 없습니다.');
        }
    } catch (e) {
        appendMessage('system', '이력 조회 실패: ' + e.message);
    }
}

function appendMessage(type, data) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${type}`;

    if (typeof data === 'string') {
        div.textContent = data;
    } else if (type === 'enter' || type === 'leave') {
        div.textContent = data.content;
    } else {
        const time = data.createdAt ? new Date(data.createdAt).toLocaleTimeString('ko-KR') : '';
        div.innerHTML = `
            <strong>${data.senderNickname || '알 수 없음'}</strong>: ${data.content}
            <div class="meta">${time}</div>
        `;
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function setStatus(connected) {
    const badge = document.getElementById('statusBadge');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');

    badge.textContent = connected ? '● 연결됨' : '● 연결 안 됨';
    badge.className = 'status ' + (connected ? 'connected' : 'disconnected');
    connectBtn.disabled = connected;
    disconnectBtn.disabled = !connected;
    messageInput.disabled = !connected;
    sendBtn.disabled = !connected;
}
</script>
</body>
</html>
