name: eat_together
description: "근처의 사람들과 함께 밥을 먹는 소셜 다이닝 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 네트워크
  dio: ^5.9.2

  # 상태관리
  flutter_riverpod: ^3.3.1

  # 라우팅
  go_router: ^17.2.3

  # 보안 저장소 (JWT 토큰)
  flutter_secure_storage: ^10.0.0

  # 딥링크 (OAuth2 콜백)
  app_links: ^7.0.0

  # URL 실행 (소셜 로그인 브라우저)
  url_launcher: ^6.3.2

  # 네이버 지도
  flutter_naver_map: ^1.2.1

  # 위치
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # WebSocket/STOMP (채팅)
  stomp_dart_client: ^3.0.1

  # Firebase (FCM 푸시)
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # UI 컴포넌트
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter_native_splash:
  color: "#E4FFEC"
  image: "assets/icon/app_icon.png"
  android_12:
    color: "#E4FFEC"
    image: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
